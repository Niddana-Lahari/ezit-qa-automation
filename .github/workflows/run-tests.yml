name: Run EZIT Automation Suites

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Select Test Suite / Module to Execute'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'login'
          - 'register'
          - 'subscription'
          - 'services'
          - 'vault'
          - 'billpay'
          - 'docai'
          - 'coverage'
          - 'profile'
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - 'dev'
          - 'prod'

jobs:
  test:
    name: Run ${{ github.event.inputs.module || 'Full' }} Tests on ${{ github.event.inputs.environment || 'DEV' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Execute Selected Suite
        env:
          CI: true
          TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
          TEST_MOBILE: ${{ secrets.TEST_MOBILE }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_MPIN: ${{ secrets.TEST_MPIN }}
          DEV_OTP: "123456"
        run: |
          MODULE="${{ github.event.inputs.module }}"
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          
          if [ "$MODULE" = "login" ]; then
            npx playwright test tests/auth/login.spec.ts --project=$ENV
          elif [ "$MODULE" = "register" ]; then
            npx playwright test tests/register/register.spec.ts --project=$ENV
          elif [ "$MODULE" = "subscription" ]; then
            npx playwright test tests/subscription/subscriptionPlans.spec.ts --project=$ENV
          elif [ "$MODULE" = "services" ]; then
            npx playwright test tests/services/ --project=$ENV
          elif [ "$MODULE" = "vault" ]; then
            npx playwright test tests/vault/ --project=$ENV
          elif [ "$MODULE" = "billpay" ]; then
            npx playwright test tests/billpay/ --project=$ENV
          elif [ "$MODULE" = "docai" ]; then
            npx playwright test tests/docai/ --project=$ENV
          elif [ "$MODULE" = "coverage" ]; then
            npx playwright test tests/coverage/ --project=$ENV
          elif [ "$MODULE" = "profile" ]; then
            npx playwright test tests/profile/ --project=$ENV
          else
            npx playwright test --project=$ENV
          fi

      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.event.inputs.module || 'full' }}
          path: web/playwright-report/
          retention-days: 30
