<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZIT - Test Automation Portal & Dashboard</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 30px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .meta {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Token configuration box */
    .config-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
    }

    .config-inputs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      flex: 1;
    }

    .config-inputs input, .config-inputs select {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .config-inputs input[type="password"] {
      width: 280px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #64748b;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .module-id {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .module-name {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .module-script {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-run {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-run:hover {
      background: var(--primary-hover);
    }

    .btn-run.running {
      background: var(--warning);
      cursor: wait;
    }

    .sub-links {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sub-links a {
      color: #38bdf8;
      text-decoration: none;
    }

    .sub-links a:hover {
      text-decoration: underline;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
      margin-top: 8px;
      text-align: center;
    }

    .status-badge.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1><span>EZIT</span> Web Automation Portal</h1>
      <p class="meta">Repository: <a href="https://github.com/Niddana-Lahari/ezit-qa-automation" target="_blank" style="color: #38bdf8;">Niddana-Lahari / ezit-qa-automation</a> (Branch: testing-ezit)</p>
    </div>
    <div>
      <a href="https://github.com/Niddana-Lahari/ezit-qa-automation/actions" target="_blank" class="btn-run" style="background: #334155;">
        View All Runs & Reports on GitHub Actions &rarr;
      </a>
    </div>
  </header>

  <!-- Interactive Trigger Configuration -->
  <div class="config-box">
    <div class="config-inputs">
      <label for="envSelect" style="font-size: 0.85rem; color: #cbd5e1;">Target Environment:</label>
      <select id="envSelect">
        <option value="dev" selected>DEV (https://dev1-fe.ezit.club)</option>
        <option value="prod">PROD (https://app.ezit.club)</option>
      </select>

      <label for="ghToken" style="font-size: 0.85rem; color: #cbd5e1; margin-left: 10px;">GitHub Token (for direct 1-click trigger):</label>
      <input type="password" id="ghToken" placeholder="Optional: GitHub Personal Access Token" />
    </div>
    <div style="font-size: 0.75rem; color: #94a3b8; max-width: 320px;">
      * Without a token, clicking "Trigger Test" opens the pre-configured GitHub Actions trigger screen with 1 click.
    </div>
  </div>

  <!-- 13 Module Automation Cards -->
  <div class="grid" id="modulesGrid"></div>
</div>

<script>
  const OWNER = "Niddana-Lahari";
  const REPO = "ezit-qa-automation";
  const BRANCH = "testing-ezit";
  const WORKFLOW_FILE = "run-module.yml";

  // The 13 exact modules mapped to existing scripts
  const modules = [
    {
      id: "register",
      title: "1. Register",
      script: "web/tests/register/register.spec.ts",
      desc: "Registration form submission, terms agreement, validation",
      urlDev: "https://dev1-fe.ezit.club/",
      urlProd: "https://app.ezit.club/"
    },
    {
      id: "login",
      title: "2. Login",
      script: "web/tests/auth/login.spec.ts",
      desc: "Valid & invalid customer login, validation prompts",
      urlDev: "https://dev1-fe.ezit.club/",
      urlProd: "https://app.ezit.club/"
    },
    {
      id: "delete_account",
      title: "3. Delete Account",
      script: "web/tests/profile/deleteAccount.spec.ts",
      desc: "Account deletion validation and confirmation modal",
      urlDev: "https://dev1-fe.ezit.club/profile/delete-account",
      urlProd: "https://app.ezit.club/profile/delete-account"
    },
    {
      id: "secure_vault",
      title: "4. Secure Vault",
      script: "web/tests/onboarding/steps_vault.spec.ts",
      desc: "Step-by-step vault navigation, KYC and setup flows",
      urlDev: "https://dev1-fe.ezit.club/dashboard",
      urlProd: "https://app.ezit.club/dashboard"
    },
    {
      id: "docai",
      title: "5. Doc AI",
      script: "web/tests/docai/docai.spec.ts",
      desc: "Document upload checklist and AI organize verification",
      urlDev: "https://dev1-fe.ezit.club/docai",
      urlProd: "https://app.ezit.club/docai"
    },
    {
      id: "coverage",
      title: "6. Complementary Coverage",
      script: "web/tests/coverage/coverage.spec.ts",
      desc: "Search query validation, coverage calculation & dynamic tables",
      urlDev: "https://dev1-fe.ezit.club/coverage",
      urlProd: "https://app.ezit.club/coverage"
    },
    {
      id: "asset_creation",
      title: "7. Asset Creation",
      script: "web/tests/vault/assetCreation.spec.ts",
      desc: "Create asset with nominee, upload document and verify list",
      urlDev: "https://dev1-fe.ezit.club/dashboard",
      urlProd: "https://app.ezit.club/dashboard"
    },
    {
      id: "appliance_creation",
      title: "8. Appliance Creation",
      script: "web/tests/vault/applianceCreation.spec.ts",
      desc: "Create appliance entry with warranty details and verify list",
      urlDev: "https://dev1-fe.ezit.club/dashboard",
      urlProd: "https://app.ezit.club/dashboard"
    },
    {
      id: "liability_creation",
      title: "9. Liability Creation",
      script: "web/tests/vault/liabilityCreation.spec.ts",
      desc: "Create liability with nominee allocation and controls",
      urlDev: "https://dev1-fe.ezit.club/dashboard",
      urlProd: "https://app.ezit.club/dashboard"
    },
    {
      id: "transport_creation",
      title: "10. Transport Creation",
      script: "web/tests/vault/transportCreation.spec.ts",
      desc: "Create transport vehicle entry with document details",
      urlDev: "https://dev1-fe.ezit.club/dashboard",
      urlProd: "https://app.ezit.club/dashboard"
    },
    {
      id: "billpay",
      title: "11. Bill Pay",
      script: "web/tests/billpay/billPay.spec.ts",
      desc: "Fetch electricity, mobile, cylinder, hospital bills & categories",
      urlDev: "https://dev1-fe.ezit.club/billpay",
      urlProd: "https://app.ezit.club/billpay"
    },
    {
      id: "profile",
      title: "12. Profile",
      script: "web/tests/profile/generalInformation.spec.ts",
      desc: "General Information verification, profile navigation",
      urlDev: "https://dev1-fe.ezit.club/profile",
      urlProd: "https://app.ezit.club/profile"
    },
    {
      id: "logout",
      title: "13. Logout",
      script: "web/tests/auth/logout.spec.ts",
      desc: "Cancel logout confirmation & complete logout redirect",
      urlDev: "https://dev1-fe.ezit.club/",
      urlProd: "https://app.ezit.club/"
    }
  ];

  const grid = document.getElementById('modulesGrid');

  modules.forEach(m => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div>
        <div class="card-header">
          <span class="module-id">${m.id}</span>
          <span style="font-size: 0.8rem; color: #10b981;">&#10003; Playwright Ready</span>
        </div>
        <div class="module-name">${m.title}</div>
        <div class="module-script">${m.script}</div>
        <p style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 15px;">${m.desc}</p>
      </div>

      <div class="card-actions">
        <button class="btn-run" onclick="triggerModule('${m.id}', this)">
          <span>&#9658;</span> Trigger ${m.title} on GitHub
        </button>
        <div id="status-${m.id}" class="status-badge"></div>
        <div class="sub-links">
          <a href="https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${m.script}" target="_blank">View Test Script Code</a>
          <a href="https://github.com/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}" target="_blank">View Run Reports</a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  async function triggerModule(moduleId, buttonElement) {
    const env = document.getElementById('envSelect').value;
    const token = document.getElementById('ghToken').value.trim();
    const statusBadge = document.getElementById(`status-${moduleId}`);

    // If GitHub Personal Access Token is provided, dispatch API call directly
    if (token) {
      buttonElement.classList.add('running');
      buttonElement.innerText = "Triggering on GitHub...";
      statusBadge.style.display = "none";

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            ref: BRANCH,
            inputs: {
              module: moduleId,
              environment: env
            }
          })
        });

        buttonElement.classList.remove('running');
        buttonElement.innerHTML = `<span>&#9658;</span> Triggered!`;

        if (response.ok) {
          statusBadge.className = 'status-badge success';
          statusBadge.innerHTML = `&#10003; Successfully started <b>${moduleId}</b> on GitHub Actions! <a href="https://github.com/${OWNER}/${REPO}/actions" target="_blank" style="color:#fff; text-decoration:underline;">View Live Execution</a>`;
        } else {
          const errData = await response.json().catch(() => ({}));
          statusBadge.className = 'status-badge error';
          statusBadge.innerText = `Error (${response.status}): ${errData.message || 'Check token permissions (requires workflow scope)'}`;
        }
      } catch (err) {
        buttonElement.classList.remove('running');
        statusBadge.className = 'status-badge error';
        statusBadge.innerText = `Network Error: ${err.message}`;
      }
    } else {
      // Direct Web Trigger Link: Opens GitHub Actions workflow dispatch page ready for 1-click execution
      const webDispatchUrl = `https://github.com/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}`;
      window.open(webDispatchUrl, '_blank');
    }
  }
</script>

</body>
</html>
